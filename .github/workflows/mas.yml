# Builds Nibble for the Mac App Store (Nibble-MAS.pkg) and, when switched on, uploads it to App Store Connect.
# Signing needs these repository secrets (the guide in docs/STORE_PUBLISHING.md shows how to get them):
#   MAS_CERT_P12_BASE64      one .p12 with BOTH "Apple Distribution" and "Mac Installer Distribution" certificates, base64
#   MAS_CERT_PASSWORD        its password
#   MAS_PROVISION_PROFILE_BASE64   the "Mac App Store" provisioning profile for lk.uvi.nibble, base64
#   APPLE_TEAM_ID            your 10-character Team ID
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   (already used for the .dmg) → upload
# Repository variable MAS_UPLOAD=1 uploads every build to App Store Connect (then pick it in the app's page).
# Without the secrets it still builds an unsigned .pkg so the packaging is checked.
name: Mac App Store (.pkg)
on:
  workflow_dispatch:
  push:
    paths: ['public/app/package.json', 'public/app/src/**', 'public/nibble/**', 'public/nibble.icns', 'lib/installer.js', 'tools/mac/build-mas.mjs', 'tools/mac/entitlements.mas*', '.github/workflows/mas.yml']
permissions:
  contents: write
concurrency:
  group: mas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pkg:
    runs-on: macos-latest
    env:
      MAS_CERT_P12_BASE64: ${{ secrets.MAS_CERT_P12_BASE64 }}
      MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
      MAS_PROVISION_PROFILE_BASE64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      MAS_UPLOAD: ${{ vars.MAS_UPLOAD }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: cd tools/mac && npm init -y >/dev/null && npm i --no-audit --no-fund @electron/universal@2 @electron/osx-sign@1
      - name: Certificates + provisioning profile
        if: env.MAS_CERT_P12_BASE64 != '' && env.MAS_PROVISION_PROFILE_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/mas.keychain-db"; KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MAS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -P "$MAS_CERT_PASSWORD" -A -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          APPID="$(security find-identity -v "$KC" | grep -E '"(Apple Distribution|3rd Party Mac Developer Application):' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          PKGID="$(security find-identity -v "$KC" | grep -E '"(Mac Installer Distribution|3rd Party Mac Developer Installer):' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "App: $APPID"; echo "Installer: $PKGID"
          echo "$MAS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/nibble.provisionprofile"
          echo "MAS_APP_IDENTITY=$APPID" >> "$GITHUB_ENV"
          echo "MAS_INSTALLER_IDENTITY=$PKGID" >> "$GITHUB_ENV"
          echo "MAS_PROFILE=$RUNNER_TEMP/nibble.provisionprofile" >> "$GITHUB_ENV"
      - name: Build Nibble-MAS.pkg
        run: node tools/mac/build-mas.mjs
      - name: Upload to App Store Connect
        if: env.MAS_UPLOAD == '1' && env.MAS_SIGNED == 'yes' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          xcrun altool --upload-app -f dist-mas/Nibble-MAS.pkg -t macos --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
      - uses: actions/upload-artifact@v4
        with:
          name: nibble-mac-app-store
          path: dist-mas/Nibble-MAS.pkg
      - name: Publish to the apps release + index (main, or when run by hand)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/apps/publish.sh mac "$MAS_VER" "$MAS_BUILD" "$([ "$MAS_SIGNED" = yes ] && echo yes || echo no)" dist-mas/Nibble-MAS.pkg
